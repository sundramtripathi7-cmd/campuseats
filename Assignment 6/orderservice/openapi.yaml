openapi: 3.0.3
info:
  title: CampusEats Orders Service
  version: 3.0.0
  description: Assignment 6 status codes, Problem Details, validation and content negotiation.
servers:
  - url: http://127.0.0.1:5001
security:
  - BearerAuth: []
paths:
  /orders:
    get:
      summary: List orders
      responses:
        '200': {description: Orders returned}
        '401': {$ref: '#/components/responses/Problem'}
        '406': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      summary: Create an order
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: {type: string}
        - in: header
          name: Accept
          required: false
          schema: {type: string, default: application/json}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Created
          headers:
            Location: {description: URI of the created order, schema: {type: string}}
          content:
            application/json: {schema: {$ref: '#/components/schemas/Order'}}
            application/xml: {schema: {type: string}}
        '401': {$ref: '#/components/responses/Problem'}
        '406': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /orders/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
    get:
      summary: Retrieve one order
      responses:
        '200': {description: Order found}
        '404': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '406': {$ref: '#/components/responses/Problem'}
    patch:
      summary: Change order status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [paid, preparing, ready, completed, cancelled]}
      responses:
        '200': {description: Order status updated}
        '402': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
    delete:
      summary: Delete a created order
      responses:
        '204': {description: Order deleted}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    OrderInput:
      type: object
      required: [items, address]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [menuItemId, qty]
            properties:
              menuItemId: {type: string}
              qty: {type: integer, minimum: 1}
        address: {type: string, minLength: 1}
    Order:
      type: object
      properties:
        id: {type: string}
        items: {type: array, items: {type: object}}
        address: {type: string}
        status: {type: string}
        total: {type: number}
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: {type: string}
              message: {type: string}
  responses:
    Problem:
      description: Error in Problem Details format
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationProblem:
      description: Field validation errors
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RateLimited:
      description: Rate limit exceeded; retry after the indicated delay
      headers:
        Retry-After: {schema: {type: integer}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
